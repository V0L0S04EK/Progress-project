name: Deploy to ISPManager via FTP

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci
    - run: npm run build # Сборка проекта в папку (например, build/)

    - name: 📂 Deploy to ISPManager via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT }}
        local-dir: ./.vitepress/dist # Укажите папку, которую нужно загрузить (из шага сборки)
        server-dir: ./www/xn--c1aezdfcia.fun/  # Путь до корня сайта на сервере ISPManager